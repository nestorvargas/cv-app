# Production deploy (server-ia). Only listens on 127.0.0.1:8075; public access is
# through the Cloudflare tunnel: cv.nestordevelop.online -> http://localhost:8075
#
#   cp .env.prod.example .env.prod   # set real secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cv_db
      POSTGRES_USER: cv_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env.prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cv_user -d cv_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    command: ["npm", "start"]
    environment:
      DATABASE_URL: postgresql://cv_user:${DB_PASSWORD}@postgres:5432/cv_db
      NODE_ENV: production
      PORT: 3001
      FRONTEND_INTERNAL_URL: http://frontend
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Define ADMIN_USERNAME en .env.prod}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD en .env.prod}
      COOKIE_SECURE: "true"
      # cloudflared + frontend nginx
      TRUST_PROXY: "2"
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:8075:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads:
