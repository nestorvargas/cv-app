services:
  postgres:
    image: postgres:15-alpine
    container_name: cv_postgres
    environment:
      POSTGRES_DB: cv_db
      POSTGRES_USER: cv_user
      POSTGRES_PASSWORD: cv_password
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cv_user -d cv_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cv_network

  backend:
    build: ./backend
    container_name: cv_backend
    ports:
      - "13001:3001"
    environment:
      DATABASE_URL: postgresql://cv_user:cv_password@postgres:5432/cv_db
      NODE_ENV: development
      PORT: 3001
      FRONTEND_INTERNAL_URL: http://frontend:5173
      # Initial admin, only created while the users table is empty (local dev only)
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin1234
      # AI assistant (Ollama). Set OLLAMA_URL in a root .env (gitignored), e.g. the server-ia Tailscale URL
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    volumes:
      - ./backend/src:/app/src
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cv_network

  frontend:
    build: ./frontend
    container_name: cv_frontend
    ports:
      - "15173:5173"
    environment:
      VITE_API_URL: http://backend:3001
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.js:/app/vite.config.js
    depends_on:
      - backend
    networks:
      - cv_network

networks:
  cv_network:
    driver: bridge

volumes:
  postgres_data:
