services:
  postgres:
    image: postgres:15-alpine
    container_name: cv_postgres
    environment:
      POSTGRES_DB: cv_db
      POSTGRES_USER: cv_user
      POSTGRES_PASSWORD: cv_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cv_user -d cv_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: cv_backend
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://cv_user:cv_password@postgres:5432/cv_db
      NODE_ENV: development
      PORT: 3001
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: cv_frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://backend:3001
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    depends_on:
      - backend

volumes:
  postgres_data:
